[project]
name = "marking-assistant"
version = "0.1.0"
description = "On-premise AI marking assistant for secondary schools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "et-xmlfile==2.0.0",
    "fastapi==0.143.0",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pypdfium2==5.14.0",
    "python-docx==1.2.0",
    "reportlab==5.0.1",
    "segno==1.6.6",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
    "zxing-cpp==3.1.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
python-preference = "only-managed"
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixed test passwords

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

# These ship without type information; the typed stub package would be an extra dependency.
[[tool.mypy.overrides]]
module = ["reportlab.*", "pypdfium2.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.8 prefers httpx2 for TestClient; httpx still works. See docs/DECISIONS.md D-010.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
